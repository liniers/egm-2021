<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EGM · Cadena SER — scrollytelling</title>
  <style>
    /* Fuentes reales del diseño, mapeadas a las familias que usa el SVG de Illustrator */
    @font-face{font-family:"Bely Display";src:url("assets/fonts/BelyDisplay.woff2") format("woff2"),url("assets/fonts/BelyDisplay.woff") format("woff");font-weight:400;font-style:normal;font-display:swap}
    @font-face{font-family:"Neutra Text TF";src:url("assets/fonts/Neutra-Regular.woff") format("woff");font-weight:400;font-style:normal;font-display:swap}
    @font-face{font-family:"Neutra Text";src:url("assets/fonts/Neutra-Regular.woff") format("woff");font-weight:400;font-style:normal;font-display:swap}
    @font-face{font-family:"Neutra Text";src:url("assets/fonts/Neutra-Bold.woff") format("woff");font-weight:700;font-style:normal;font-display:swap}
    @font-face{font-family:"Neutra Text TF";src:url("assets/fonts/Neutra-Light.woff") format("woff");font-weight:300;font-style:normal;font-display:swap}

    :root{ --maxw: 760px; }
    *{box-sizing:border-box}
    html,body{margin:0}
    body{background:#faf2ef;-webkit-font-smoothing:antialiased}
    .frame{max-width:var(--maxw);margin:0 auto}
    .frame svg{display:block;width:100%;height:auto}
    .scroll-progress{position:fixed;top:0;left:0;height:3px;width:0;background:#db2a00;z-index:100}
    #loading{position:fixed;inset:0;display:grid;place-items:center;font-family:"Neutra Text",sans-serif;color:#192b77}

    /* ---- Cursor personalizado (punto → pill de texto), estilo portfolio-2027 ---- */
    @media (hover:hover) and (pointer:fine){
      body{cursor:none}
      .cursor{position:fixed;top:0;left:0;width:14px;height:14px;border-radius:100em;z-index:9999;pointer-events:none}
      .cursor-bg{width:100%;height:100%;border-radius:inherit;background:#192b77}
      .egm-pill{position:fixed;top:0;left:0;z-index:9998;pointer-events:none;display:flex;align-items:center;
        padding:.62em 1em;border-radius:2em;opacity:0}
      .egm-pill__bg{position:absolute;inset:0;border-radius:2em;z-index:0}
      .egm-pill__text{position:relative;z-index:1;white-space:nowrap;font-family:"Neutra Text",sans-serif;
        font-weight:700;font-size:15px;letter-spacing:.01em;color:#faf2ef;opacity:0}
      .egm-pill[data-egm-cursor="active"]{opacity:1}
      .egm-pill[data-egm-cursor="active"] .egm-pill__text{opacity:1;transition:opacity .2s .12s}
    }
  </style>
</head>
<body>
  <div class="scroll-progress" id="progress"></div>
  <div id="loading">Cargando…</div>
  <div class="frame" id="frame"></div>

  <!-- Cursor personalizado -->
  <div class="cursor"><div class="cursor-bg"></div></div>
  <div class="egm-pill" data-egm-cursor>
    <div class="egm-pill__bg" data-egm-cursor-bg></div>
    <span class="egm-pill__text">Escucha</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/DrawSVGPlugin.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Flip.min.js"></script>
  <script src="assets/js/svg.js" type="module"></script>
</body>
</html>
